name: Release

# Releases are built here rather than on a laptop so that `main.js` and
# `styles.css` carry a provenance attestation: proof that what is attached to a
# release came from the source in this repository, by this workflow. `main.js` is not in the
# repository — it is generated — so without this there is no way to check that
# what a reader downloads matches what they can read.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Refuse a tag that doesn't match the manifest
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest." >&2
            echo "Obsidian downloads the release matching the manifest, so these have to agree." >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Refuse a bundle that executes strings
        run: |
          for pattern in 'createElement("script")' 'new Function(' 'eval('; do
            if grep -qF "$pattern" main.js; then
              echo "main.js contains $pattern." >&2
              exit 1
            fi
          done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      # An annotated tag carries the release notes in its own message, so the
      # prose that describes a release lives with the release rather than as a
      # file in the plugin's source. A lightweight tag falls back to the commit
      # subjects, which read well enough here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format="%(contents)" > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md main.js manifest.json styles.css
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes main.js manifest.json styles.css
          fi
